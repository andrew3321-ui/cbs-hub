    <circle cx="272" cy="137" r="9" fill="#F4B94F" stroke="#071D2B" stroke-width="3"/>
    <circle cx="312" cy="115" r="6.5" fill="#27C2B8" stroke="#fff" stroke-opacity=".9" stroke-width="2.6"/>
    <circle cx="317" cy="137" r="6.5" fill="#27C2B8" fill-opacity=".75" stroke="#fff" stroke-opacity=".68" stroke-width="2.6"/>
    <circle cx="312" cy="159" r="6.5" fill="#27C2B8" stroke="#fff" stroke-opacity=".9" stroke-width="2.6"/>
  </g>

  <text x="347" y="149" fill="#F5FBFC" font-family="Arial, Helvetica, sans-serif" font-size="42" letter-spacing="-1.7"><tspan font-weight="800">CBS</tspan><tspan font-weight="500">Hub</tspan></text>

