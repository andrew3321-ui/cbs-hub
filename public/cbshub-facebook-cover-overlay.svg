<svg xmlns="http://www.w3.org/2000/svg" width="1702" height="630" viewBox="0 0 1702 630" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="258" y1="105" x2="326" y2="181" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D3143"/>
      <stop offset="1" stop-color="#071D2B"/>
    </linearGradient>
    <linearGradient id="linkTop" x1="278" y1="143" x2="312" y2="124" gradientUnits="userSpaceOnUse">
